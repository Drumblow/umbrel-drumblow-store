version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: drumblow-painel_web_1
      APP_PORT: 8080
      # Login do umbrelOS na frente do login próprio do painel (padrão; não desligar).

  web:
    image: ghcr.io/drumblow/painel-escritorio:0.3.11@sha256:c11053727d4055a9280a82c0ee32bbb8a78f4cbc9d5448ab34a3140261d138fa
    command: ["servir"]
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      # Pastas preparadas pelo hooks/pre-install (dono 1000:1000; configuração genérica criada uma vez).
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/dados:/dados
      - ${APP_DATA_DIR}/data/backups:/backups
      # Fontes do Hermes, SÓ LEITURA (docs do projeto: F0-09). Só as três subpastas, nunca a raiz
      # (lá ficam as credenciais do Hermes). O painel nunca escreve nelas.
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/acervo:/fontes/hermes/acervo:ro
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/documents:/fontes/hermes/documents:ro
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/relatorios:/fontes/hermes/relatorios:ro
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/ocr_acervo:/fontes/hermes/ocr:ro
    environment:
      # Primeiro acesso: com o banco sem usuários, cria este usuário com a senha que o umbrelOS
      # mostra na tela do app. Depois disso as variáveis são ignoradas.
      PAINEL_USUARIO_INICIAL: admin
      PAINEL_SENHA_INICIAL: ${APP_PASSWORD}

  # Construtor agendado: mesma imagem, monta o read model a partir das fontes (horários do
  # [construtor] da configuração local, rodada nova do assistente e pedidos "atualizar agora").
  construtor:
    image: ghcr.io/drumblow/painel-escritorio:0.3.11@sha256:c11053727d4055a9280a82c0ee32bbb8a78f4cbc9d5448ab34a3140261d138fa
    command: ["construir", "--agendado"]
    user: "1000:1000"
    restart: on-failure
    depends_on:
      - web
    # SIGTERM espera a rodada em curso terminar; cada módulo grava na sua transação.
    stop_grace_period: 2m
    # O HEALTHCHECK da imagem chama a API do web, que este serviço não ouve.
    healthcheck:
      disable: true
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/dados:/dados
      - ${APP_DATA_DIR}/data/backups:/backups
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/acervo:/fontes/hermes/acervo:ro
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/documents:/fontes/hermes/documents:ro
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/relatorios:/fontes/hermes/relatorios:ro
      - ${UMBREL_ROOT}/app-data/hermes-agent/data/hermes/ocr_acervo:/fontes/hermes/ocr:ro
