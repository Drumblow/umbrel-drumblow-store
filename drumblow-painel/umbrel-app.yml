manifestVersion: 1.1
id: drumblow-painel
category: files
name: Painel do Escritório
# Sem este campo o umbreld procura o ícone na galeria oficial, que não tem apps de loja comunitária.
icon: https://raw.githubusercontent.com/Drumblow/umbrel-drumblow-store/main/drumblow-painel/icon.svg
version: "0.3.11"
tagline: Mesa de trabalho do escritório de advocacia, no seu próprio servidor
description: >-
  Painel de gestão para escritório de advocacia que roda no seu servidor: prazos, processos,
  audiências, clientes e honorários numa tela só, com login próprio. Os dados não saem do
  dispositivo.


  Esta versão traz a base de dados de trabalho (leitura dos dados do assistente e atualização
  agendada). As telas de trabalho chegam nas próximas versões.


  Depois de instalar, entre com o usuário e a senha mostrados pelo umbrelOS. A identidade do
  escritório é configurada no arquivo local de configuração do app.
developer: Drumblow
website: https://github.com/Drumblow/umbrel-drumblow-store
dependencies: []
repo: https://github.com/Drumblow/umbrel-drumblow-store
support: https://github.com/Drumblow/umbrel-drumblow-store/issues
port: 8552
gallery: []
path: ""
defaultUsername: admin
deterministicPassword: true
releaseNotes: >-
  Honorários agora lê os autos. A cada atualização, o painel lê o texto dos documentos públicos de cada processo e mostra em que ponto está a cobrança: RPV expedido, depósito feito, alvará pedido, alvará determinado e alvará expedido, com a data e há quantos dias. A aba Ações de cobrança abre com as ações que aguardam, contadas por etapa, e cada linha diz o que falta (por exemplo, "falta pedir o alvará"). Uma ação só conta como paga com o alvará expedido ou a extinção pelo pagamento nos autos; quando os autos e o levantamento discordam, ela vai para conferir, com o motivo. A ficha do processo também mostra esse caminho. Há uma aba nova, Por procuração, para os processos sem nomeação de dativa nos autos, com procuração sua e sem nenhum sinal de honorário. O honorário fixado na sentença passa a ser lido nos autos, com o valor quando a sentença traz. Texto de leitura ruim nunca vira fato: fica só como sinal para conferir.
