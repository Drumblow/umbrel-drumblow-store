manifestVersion: 1.1
id: drumblow-painel
category: files
name: Painel do Escritório
# Sem este campo o umbreld procura o ícone na galeria oficial, que não tem apps de loja comunitária.
icon: https://raw.githubusercontent.com/Drumblow/umbrel-drumblow-store/main/drumblow-painel/icon.svg
version: "0.3.12"
tagline: Mesa de trabalho do escritório de advocacia, no seu próprio servidor
description: >-
  Painel de gestão para escritório de advocacia que roda no seu servidor: prazos, processos,
  audiências, clientes e honorários numa tela só, com login próprio. Os dados não saem do
  dispositivo.


  Esta versão traz a base de dados de trabalho (leitura dos dados do assistente e atualização
  agendada). As telas de trabalho chegam nas próximas versões.


  Depois de instalar, entre com o usuário e a senha mostrados pelo umbrelOS. A identidade do
  escritório é configurada no arquivo local de configuração do app.
developer: Drumblow
website: https://github.com/Drumblow/umbrel-drumblow-store
dependencies: []
repo: https://github.com/Drumblow/umbrel-drumblow-store
support: https://github.com/Drumblow/umbrel-drumblow-store/issues
port: 8552
gallery: []
path: ""
defaultUsername: admin
deterministicPassword: true
releaseNotes: >-
  Todas as páginas do menu agora funcionam. Clientes: a lista com busca pelo nome, pelas iniciais ou pelo número do processo, e a ficha de cada cliente, com o cadastro (telefone, e-mail, endereço, quem indicou e observações, com o histórico de cada mudança), os atendimentos registrados e os dados sugeridos pela procuração, que só entram quando você confirma. Tarefas: um quadro com a fazer, fazendo, aguardando e feito, com prazo, responsável e ligação com o processo; mover por arrastar ou pelo botão "mover para"; concluir pede um resumo e nada se apaga. Audiências: a agenda de Próximas, Hoje, Amanhã, Semana, Mês e Passadas, com o link da audiência para copiar, a exportação para o Google Agenda (.ics) e a pauta para imprimir. Documentos: todos os documentos do acervo com busca, os que chegaram por último e os relatórios do escritório. Relatórios: a carteira de processos e os alertas (processo parado, prazo não tratado, cliente sem contato, dativo sem pedido, RPV parado, conferir sigilo e ligação duvidosa), cada um com o porquê. Configurações: o estado do sistema em frases simples, com o que fazer; as suas sessões abertas e a troca de senha; e a versão do painel.
