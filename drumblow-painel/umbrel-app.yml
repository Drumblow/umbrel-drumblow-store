manifestVersion: 1.1
id: drumblow-painel
category: files
name: Painel do Escritório
# Sem este campo o umbreld procura o ícone na galeria oficial, que não tem apps de loja comunitária.
icon: https://raw.githubusercontent.com/Drumblow/umbrel-drumblow-store/main/drumblow-painel/icon.svg
version: "0.3.26"
tagline: Mesa de trabalho do escritório de advocacia, no seu próprio servidor
description: >-
  Painel de gestão para escritório de advocacia que roda no seu servidor: prazos, processos,
  audiências, clientes e honorários numa tela só, com login próprio. Os dados não saem do
  dispositivo.


  Esta versão traz a base de dados de trabalho (leitura dos dados do assistente e atualização
  agendada). As telas de trabalho chegam nas próximas versões.


  Depois de instalar, entre com o usuário e a senha mostrados pelo umbrelOS. A identidade do
  escritório é configurada no arquivo local de configuração do app.
developer: Drumblow
website: https://github.com/Drumblow/umbrel-drumblow-store
dependencies: []
repo: https://github.com/Drumblow/umbrel-drumblow-store
support: https://github.com/Drumblow/umbrel-drumblow-store/issues
port: 8552
gallery: []
path: ""
defaultUsername: admin
deterministicPassword: true
# F15-06: o banco vivo fica fora do backup do umbrelOS (uma cópia dele no meio de uma escrita
# pode voltar estragada); as cópias diárias conferidas em data/backups vão junto, e o painel se
# restaura sozinho da mais recente quando sobe sem o banco vivo.
backupIgnore:
  - data/dados/painel.sqlite
  - data/dados/painel.sqlite-wal
  - data/dados/painel.sqlite-shm
  - data/dados/painel.sqlite.restaurando
  - data/dados/painel.sqlite.em-uso
  - data/dados/cache
  - data/backups/*.tmp
releaseNotes: >-
  Correções da peça que estava na versão anterior.
  
  - Impressão: a paginação respeita as margens da peça e o zoom da tela. Antes, com margens maiores, o pé da folha podia ser cortado sem aviso.
  - O contador de pendências no pé entra na conta da página (soma a margem do aviso).
  - "Localizar e substituir" não apaga mais um dado do processo: um trecho que está dentro de um dado não é substituído, e a tela avisa quantos ficaram de fora.
  - O dado do processo aparece no DOCX (antes saía em branco) e conta nas palavras e nos caracteres.
  - O timbre aparece igual na tela e no papel (Times, centrado).
  - Configurações → Estúdio: margem vazia não vira 0 mm sem aviso, valor acima de 60 é recusado com mensagem do painel, e o "Preferências gravadas" some quando você mexe num campo.
  - O painel "Dados" da peça recebe o foco ao abrir e devolve ao botão ao fechar.

  - O contador de pendências aparece no pé de cada folha impressa, com o mesmo número da faixa: "3 pendências a conferir".
  - Peça sem pendências não ganha aviso, e o pé da folha não fica vazio.
  - O pé e o timbre passam a sair na tipografia do escritório (Times), com o contador abaixo deles.
  - A altura do contador entra na conta da paginação: nenhum bloco invade mais os últimos milímetros da folha.
