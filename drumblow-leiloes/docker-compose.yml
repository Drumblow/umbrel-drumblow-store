version: "3.7"

# Leilões — Coletor e Painel
#
# O código-fonte (as cinco casas + painel + valores) NÃO fica na imagem: ele é copiado depois da
# instalação para ${APP_DATA_DIR}/src e montado em /projetos dentro de cada serviço. Assim o
# projeto não precisa ser publicado em imagem/registry nenhum.
#
# Acesso a disco MÍNIMO por serviço (A20): o CÓDIGO de cada projeto é montado SOMENTE-LEITURA e a
# escrita fica restrita às pastas de dados e logs de cada serviço (banco SQLite + sidecars do WAL,
# .pid e saída de log). O painel (web) lê os 7 projetos e escreve apenas no próprio data/ e logs/;
# valores e backup leem os bancos em somente-leitura. Sem isso, um serviço comprometido poderia
# reescrever o código que os outros executam (o web enxergava o src/ inteiro com escrita).
#
# Logs com teto (json-file 10 MB × 3): sem isso os logs do Docker crescem sem limite no disco.
#
# 1.5.5 (lote 2 da auditoria v3): imagens fixadas por DIGEST (node:22-alpine e tailscale:latest —
# roda exatamente o que foi auditado, mesmo que a tag mude), healthcheck nos quatro serviços
# críticos (web/porteiro/auth/tailscale) e limite de CPU/memória por serviço — sem teto, um
# serviço com vazamento derrubava a casa inteira.
#
# Imagem base: node:22-alpine (oficial). A versão 22.13 do Node já traz o módulo node:sqlite sem
# flag experimental — é o banco dos coletores.

x-log: &log-limits
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-lim-medio: &lim-medio
  resources:
    limits:
      cpus: "1"
      memory: 512M

x-lim-leve: &lim-leve
  resources:
    limits:
      cpus: "1"
      memory: 256M

x-lim-minimo: &lim-minimo
  resources:
    limits:
      cpus: "0.5"
      memory: 128M

services:
  app_proxy:
    environment:
      APP_HOST: drumblow-leiloes_web_1
      APP_PORT: 8787
    logging: *log-limits

  # ── Painel (único serviço com porta exposta pelo umbrelOS) ─────────────
  web:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "server.js"]
    working_dir: /projetos/auction-dashboard
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      PROJ_ROOT: /projetos
      LEILOES_SERVER: "1"
      PORT: "8787"
      # 0.0.0.0 é obrigatório em container: com 127.0.0.1 o gateway do umbrelOS não alcança o
      # painel e a porta do app nunca é publicada (foi o que travou a primeira instalação).
      HOST: "0.0.0.0"
    volumes:
      # código :ro; escrita só no próprio data/ (pid do painel) e logs/. Os demais projetos são
      # lidos em :ro (a leitura de banco SQLite em WAL funciona com os sidecars criados pelos
      # donos dos bancos — mesmo padrão que valores e backup já usam em produção).
      - ${APP_DATA_DIR}/src/auction-dashboard:/projetos/auction-dashboard:ro
      - ${APP_DATA_DIR}/src/auction-dashboard/data:/projetos/auction-dashboard/data
      - ${APP_DATA_DIR}/src/auction-dashboard/logs:/projetos/auction-dashboard/logs
      - ${APP_DATA_DIR}/src/kotn-tracker:/projetos/kotn-tracker:ro
      - ${APP_DATA_DIR}/src/encore-tracker:/projetos/encore-tracker:ro
      - ${APP_DATA_DIR}/src/lmax-tracker:/projetos/lmax-tracker:ro
      - ${APP_DATA_DIR}/src/mongers-tracker:/projetos/mongers-tracker:ro
      - ${APP_DATA_DIR}/src/mckenzies-tracker:/projetos/mckenzies-tracker:ro
      - ${APP_DATA_DIR}/src/product-values:/projetos/product-values:ro
      - ${APP_DATA_DIR}/src/auth-service:/projetos/auth-service:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy: *lim-medio
    logging: *log-limits

  # ── Porteiro do acesso externo (limite de requisições + contas) ────────
  # Só existe por causa do caminho público: Tailscale Funnel → função na Vercel.
  # O acesso pela LAN e pela interface do umbrelOS continua direto no painel (web),
  # sem senha extra. Sem o arquivo de segredos o serviço não sobe (proteção).
  auth-proxy:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "auth-proxy.js"]
    working_dir: /projetos/auction-dashboard
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      AUTH_PORT: "8788"
      AUTH_DESTINO_HOST: "web"
      AUTH_DESTINO_PORTA: "8787"
      AUTH_UPSTREAM: "http://auth:8791"
      PAINEL_AUTH_ARQUIVO: /segredos/auth.env
    volumes:
      - ${APP_DATA_DIR}/src/auction-dashboard:/projetos/auction-dashboard:ro
      - ${APP_DATA_DIR}/auth.env:/segredos/auth.env:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8788/api/auth?acao=health' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy: *lim-minimo
    logging: *log-limits

  # ── Contas (cadastro/login com código de 6 dígitos por e-mail) ─────────
  # Rotas /auth/* e /api/auth/* passam pelo auth-proxy SEM o Basic do painel (têm limite próprio).
  # O envio de e-mail usa o smtp.env (senha de app do Gmail — fora do repositório).
  auth:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/server.js"]
    working_dir: /app
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      AUTH_PORT: "8791"
      AUTH_DB: /app/data/auth.db
      AUTH_LOG_DIR: /app/logs
    volumes:
      # código :ro; escrita só no banco (data/) e nos logs
      - ${APP_DATA_DIR}/src/auth-service:/app:ro
      - ${APP_DATA_DIR}/src/auth-service/data:/app/data
      - ${APP_DATA_DIR}/src/auth-service/logs:/app/logs
      - ${APP_DATA_DIR}/smtp.env:/app/smtp.env:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8791/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy: *lim-leve
    logging: *log-limits

  # ── Tailscale: túnel de saída (Funnel) ────────────────────────────────
  # Não publica porta nenhuma: o container disca para fora e o Funnel entrega
  # https://leiloes-painel.<tailnet>.ts.net → auth-proxy (8788) → painel.
  # Além disso serve, só dentro do tailnet, a porta 8443 direto no painel.
  tailscale:
    image: tailscale/tailscale:latest@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    hostname: leiloes-painel
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/tailscale.env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ${APP_DATA_DIR}/ts-state:/var/lib/tailscale
      - ${APP_DATA_DIR}/ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    depends_on:
      - auth-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9002/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy: *lim-leve
    logging: *log-limits

  # ── KOTN: lances ao vivo (websocket) ───────────────────────────────────
  kotn-collector:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/collector.js"]
    working_dir: /projetos/kotn-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 20s
    volumes:
      - ${APP_DATA_DIR}/src/kotn-tracker:/projetos/kotn-tracker:ro
      - ${APP_DATA_DIR}/src/kotn-tracker/data:/projetos/kotn-tracker/data
      - ${APP_DATA_DIR}/src/kotn-tracker/logs:/projetos/kotn-tracker/logs
    deploy: *lim-leve
    logging: *log-limits

  # ── KOTN: catálogo + estado dos itens ──────────────────────────────────
  kotn-sweeper:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/sweeper.js"]
    working_dir: /projetos/kotn-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/kotn-tracker:/projetos/kotn-tracker:ro
      - ${APP_DATA_DIR}/src/kotn-tracker/data:/projetos/kotn-tracker/data
      - ${APP_DATA_DIR}/src/kotn-tracker/logs:/projetos/kotn-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── Encore/HiBid: lotes + fechamento ───────────────────────────────────
  encore-sweeper:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/sweeper.js"]
    working_dir: /projetos/encore-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/encore-tracker:/projetos/encore-tracker:ro
      - ${APP_DATA_DIR}/src/encore-tracker/data:/projetos/encore-tracker/data
      - ${APP_DATA_DIR}/src/encore-tracker/logs:/projetos/encore-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── Encore/HiBid: históricos de lances (fila própria) ──────────────────
  encore-historian:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/historian.js"]
    working_dir: /projetos/encore-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/encore-tracker:/projetos/encore-tracker:ro
      - ${APP_DATA_DIR}/src/encore-tracker/data:/projetos/encore-tracker/data
      - ${APP_DATA_DIR}/src/encore-tracker/logs:/projetos/encore-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── Liquidation Max/HiBid: lotes + fechamento ──────────────────────────
  lmax-sweeper:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/sweeper.js"]
    working_dir: /projetos/lmax-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/lmax-tracker:/projetos/lmax-tracker:ro
      - ${APP_DATA_DIR}/src/lmax-tracker/data:/projetos/lmax-tracker/data
      - ${APP_DATA_DIR}/src/lmax-tracker/logs:/projetos/lmax-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── Liquidation Max/HiBid: históricos de lances (fila própria) ─────────
  lmax-historian:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/historian.js"]
    working_dir: /projetos/lmax-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/lmax-tracker:/projetos/lmax-tracker:ro
      - ${APP_DATA_DIR}/src/lmax-tracker/data:/projetos/lmax-tracker/data
      - ${APP_DATA_DIR}/src/lmax-tracker/logs:/projetos/lmax-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── Auction Mongers/HiBid: lotes + fechamento ──────────────────────────
  mongers-sweeper:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/sweeper.js"]
    working_dir: /projetos/mongers-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/mongers-tracker:/projetos/mongers-tracker:ro
      - ${APP_DATA_DIR}/src/mongers-tracker/data:/projetos/mongers-tracker/data
      - ${APP_DATA_DIR}/src/mongers-tracker/logs:/projetos/mongers-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── Auction Mongers/HiBid: históricos de lances (fila própria) ─────────
  mongers-historian:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/historian.js"]
    working_dir: /projetos/mongers-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
