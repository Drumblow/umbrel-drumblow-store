      - ${APP_DATA_DIR}/src/mongers-tracker/data:/projetos/mongers-tracker/data
      - ${APP_DATA_DIR}/src/mongers-tracker/logs:/projetos/mongers-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── McKenzie's/HiBid: lotes + fechamento ───────────────────────────────
  mckenzies-sweeper:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/sweeper.js"]
    working_dir: /projetos/mckenzies-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/src/mckenzies-tracker:/projetos/mckenzies-tracker:ro
      - ${APP_DATA_DIR}/src/mckenzies-tracker/data:/projetos/mckenzies-tracker/data
      - ${APP_DATA_DIR}/src/mckenzies-tracker/logs:/projetos/mckenzies-tracker/logs
    deploy: *lim-medio
    logging: *log-limits

  # ── McKenzie's/HiBid: históricos de lances (fila própria) ──────────────
  mckenzies-historian:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--no-warnings", "src/historian.js"]
    working_dir: /projetos/mckenzies-tracker
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
