manifestVersion: 1.1
id: drumblow-leiloes
category: files
name: Leilões — Coletor e Painel
# Sem este campo o umbreld procura o ícone na galeria oficial, que não tem apps de loja comunitária.
icon: https://raw.githubusercontent.com/Drumblow/umbrel-drumblow-store/main/drumblow-leiloes/icon.svg
version: "1.5.6"
tagline: Coleta 5 casas de leilão (KOTN + HiBid), guarda os lances e mostra o valor de mercado
description: >-
  Coletor e painel dos leilões que você acompanha (King of the North, Encore Auctions, Liquidation
  Max, Auction Mongers e McKenzie's — HiBid).
  Guarda o catálogo, o histórico completo de lances, o preço final de cada arremate e o valor de
  referência de cada produto (vendas anteriores do mesmo item, por condição, e busca de preço na
  Amazon quando o item é novo/usado), além do custo real com as taxas de cada casa (prêmio do
  comprador, manuseio, HST e taxa de cartão).


  O painel é só leitura dos bancos: você filtra por site, categoria, condição e faixa de preço,
  ordena por maior desconto em relação ao valor de referência e vê a ficha de cada lote com a
  linha do tempo dos lances. Os dados não saem do seu servidor.


  Depois de instalar, os serviços começam em alguns segundos. Os coletores e o serviço de valores
  aparecem no painel com o horário do último sinal de vida.
developer: Drumblow
website: https://github.com/Drumblow/umbrel-drumblow-store
dependencies: []
repo: https://github.com/Drumblow/umbrel-drumblow-store
support: https://github.com/Drumblow/umbrel-drumblow-store/issues
port: 8790
gallery: []
path: ""
backupIgnore:
  # O banco vivo fica fora do backup do umbrelOS (uma cópia no meio de uma escrita pode voltar
  # estragada). O app mantém cópias consistentes (VACUUM INTO) em src/auction-dashboard/backups/,
  # e são essas que vão.
  - src/kotn-tracker/data/kotn.db
  - src/kotn-tracker/data/kotn.db-wal
  - src/kotn-tracker/data/kotn.db-shm
  - src/encore-tracker/data/encore.db
  - src/encore-tracker/data/encore.db-wal
  - src/encore-tracker/data/encore.db-shm
  - src/lmax-tracker/data/lmax.db
  - src/lmax-tracker/data/lmax.db-wal
  - src/lmax-tracker/data/lmax.db-shm
  - src/mongers-tracker/data/mongers.db
  - src/mongers-tracker/data/mongers.db-wal
  - src/mongers-tracker/data/mongers.db-shm
  - src/mckenzies-tracker/data/mckenzies.db
  - src/mckenzies-tracker/data/mckenzies.db-wal
  - src/mckenzies-tracker/data/mckenzies.db-shm
  - src/product-values/data/values.db
  - src/product-values/data/values.db-wal
  - src/product-values/data/values.db-shm
  # As cópias consistentes do backup.js (src/auction-dashboard/backups/) NÃO são ignoradas de
  # propósito: são elas que devem viajar no backup do umbrelOS (os .db vivos acima é que ficam fora).
  - src/auth-service/data/auth.db
  - src/auth-service/data/auth.db-wal
  - src/auth-service/data/auth.db-shm
  # Higiene: logs, pids e exports fora do backup do umbrelOS
  - src/*/logs/*.log
  - src/*/data/*.pid
  - src/*/exports/*
  # Segredos do app (senha do painel, smtp, tailscale) ficam FORA do backup do umbrelOS
  - auth.env
  - smtp.env
  - tailscale.env
  - ts-state
  - ts-state/*
releaseNotes: >-
  1.5.5: lote 2 da auditoria v3 — imagens fixadas por DIGEST (node:22-alpine e tailscale:latest:
  roda exatamente o que foi auditado, mesmo que a tag mude), healthcheck nos quatro serviços
  críticos (painel, porteiro, contas e tailscale) e limite de CPU/memória por serviço — sem teto,
  um serviço com vazamento derrubava a casa inteira. Sem mudança de comportamento visível.


  1.5.4: isolamento fino de permissões (A20 da auditoria v2) — o código de cada projeto é montado
  SOMENTE-LEITURA nos containers e a escrita fica restrita às pastas de dados e logs de cada
  serviço (bancos + sidecars do WAL, .pid e saída de log). Antes, o painel enxergava o src/ inteiro
  com escrita e um serviço comprometido poderia reescrever o código que os outros executam. Sem
  mudança de comportamento visível — só permissões.


  1.5.3: correções P1 da auditoria v2 — coletores (carimbo de varredura só com varredura completa,
  fatal de 4xx sem retry, revision sem wipe, OCR sem chaves não condena a fila); serviço de contas
  (pepper gerado e fail-closed, cooldown único com chave canônica do Gmail, scrypt assíncrono,
  timeouts, prune de códigos/eventos); painel/edge (teto no export, cookie/content-type/retry-after
  repassados); segredos fora do backup do umbrelOS; pids em src/*/data/ no ignore.


  1.5.2: correções da auditoria v2 — o backup do umbrelOS volta a incluir as cópias consistentes do
  backup.js e passa a excluir o auth.db vivo (restore confiável); os scripts de publicação/instalação
  cobrem o auth-service e os caminhos certos do src/; endurecimento do serviço de contas (rate-limit
  não burlável por header, contadores com evicção, respostas genéricas contra enumeração de e-mail).


  1.5.1: o serviço de contas passa a ler o smtp.env também do arquivo montado (/app/smtp.env) —
  trocar a senha de app vale com um simples restart, sem recriar o container — e ganha a rota
  /auth/health para o health check público.


  1.5.0: serviço de CONTAS — cadastro com verificação por código de 6 dígitos enviado por e-mail
  (Gmail SMTP, senha de app em smtp.env), login com sessão, recuperação de senha, limites de
  tentativa e backup próprio. As rotas /auth/* e /api/auth/* passam pelo porteiro sem a senha
  compartilhada (têm limite próprio); o resto continua como antes.


  1.4.2: o gancho de instalação cria também os MODELOS de tailscale.env, ts-serve.json e (agora)
  a primeira instalação não trava esperando arquivos que só o operador criava à mão (a chave do
  Tailscale continua sendo sua, preenchida depois). Correções de robustez no painel: parada de
  processo só libera o pidfile depois da morte real (sem 2ª instância no mesmo banco), datas da
  interface no horário de Toronto, total do cabeçalho coerente com os filtros e trava de caminho
  na rota /static/.


  1.4.0: acesso a disco mínimo por serviço (cada coletor só enxerga a própria pasta; valores e
  backup leem os bancos em somente-leitura) e teto de logs do Docker (10 MB × 3 por serviço) —
  sem isso um coletor comprometido poderia reescrever o painel e os logs cresciam sem limite no
  disco. Também: cache de 12 s no status do painel (menos consultas com várias abas abertas),
  campo de usuário na tela de acesso público e retentativa contra o bloqueio 503 da Amazon.


  1.3.1: correções da auditoria completa — scripts de deploy agora cobrem as 5 casas, painel sem
  fallback de escrita (nunca cria banco vazio), guarda anti-reabertura e retry de SQLITE_BUSY no
  coletor do KOTN, caminho dos backups alinhado (src/auction-dashboard/backups) e higiene de
  logs/pids/exports no backup do umbrelOS. Título do painel atualizado para as 5 fontes.


  1.3.0: quinta casa no serviço — McKenzie's Associated Auctioneers (HiBid), a ~1h de Sarnia, em
  London. Dois leilões de returns por semana (quarta e domingo ~18h) + leilões paralelos (veículos,
  estates), ~5–6 mil lotes/semana e 2.394 arquivados para backfill. Taxas dos returns confirmadas no
  aviso deles: 17% de prêmio + HST e $1,50 de manuseio por item (taxa de cartão não mencionada —
  provisória em 0). Dois serviços novos (lotes + históricos); painel e valores somam a quinta fonte.


  1.2.0: quarta casa no serviço — Auction Mongers (HiBid), com três leilões por semana (quarta
  20h, sexta 20h e domingo 18h), cerca de 5–6 mil lotes por semana, retirada em Richmond Hill
  (GTA) e envio pelo Canadá. Dois serviços novos (lotes + históricos); painel e valores somam a
  quarta fonte. Taxas do leilão ainda provisórias no painel (a confirmar com o leiloeiro).


  1.1.0: nova casa no serviço — Liquidation Max Inc (HiBid), com três leilões por semana (quinta,
  domingo e a "50¢" de segunda), cerca de 11–14 mil lotes por semana, retirada em
  London/Chatham/Windsor/Mississauga. Dois serviços novos (lotes + históricos de lances); painel e
  serviço de valores passam a somar a terceira fonte. Taxas: 16% de prêmio + HST + 1,5% de cartão
  (manuseio provisório até confirmar no T&C deles).


  1.0.3: serviço Tailscale — túnel de saída (Funnel) que expõe a porta 8788 (o porteiro, com
  senha) em https://leiloes-painel.<tailnet>.ts.net, sem abrir porta nenhuma. Dentro do tailnet,
  a porta 8443 serve o painel direto. A chave fica em tailscale.env, fora do repositório.


  1.0.2: novo serviço "porteiro" (auth-proxy) — exige usuário e senha (HTTP Basic) e limita
  requisições por IP, para o acesso externo via Tailscale Funnel + função na Vercel. A senha é
  gerada na instalação em auth.env, fora do repositório; o acesso pela LAN e pela interface do
  umbrelOS continua direto no painel, sem senha extra. Rotas de controle ficam bloqueadas no
  caminho externo.


  1.0.1: o painel passa a escutar em 0.0.0.0 dentro do container (com 127.0.0.1 o gateway do
  umbrelOS não alcançava e a porta do app não era publicada). Heartbeat do painel agora reconhece
  os logs diários dos containers. Backup: corrige colisão de nome quando duas cópias caem na mesma
  hora e mantém a cópia mais recente como ultimo-<banco>.db.


  Primeira versão: coletores do King of the North (websocket + catálogo) e do Encore/HiBid
  (GraphQL), historiador de lances, serviço de valor de mercado (comps internos por condição +
  Amazon) e painel unificado com filtros, ficha do lote, taxa de cada casa e backup próprio.
